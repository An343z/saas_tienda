services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: saas_tienda
      POSTGRES_USER: saas_tienda
      POSTGRES_PASSWORD: cambia_esta_contrasena
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    depends_on:
      - db
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/saas_tienda
      SPRING_DATASOURCE_USERNAME: saas_tienda
      SPRING_DATASOURCE_PASSWORD: cambia_esta_contrasena
      SAAS_TIENDA_CORS_ORIGINS: "*"
    ports:
      - "8080:8080"

volumes:
  postgres_data:
